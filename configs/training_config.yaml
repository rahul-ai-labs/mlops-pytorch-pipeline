model:
  architecture: resnet18
  num_classes: 10

data:
  dataset: CIFAR10
  data_dir: data
  num_workers: 0

training:
  epochs: 20
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 5
  resume: true

output:
  checkpoint_dir: checkpoints
  checkpoint_every: 1
  keep_last_checkpoints: 2